<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мозайка Назаралиевы</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Tektur:wght@700;900&family=Exo+2:wght@800&family=Underdog&family=Neucha&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#03040c;--bg2:#0a1030;--gold:#9ad7ff;--red:#6f55ff;--teal:#4f7cff;--wool:#eaf2ff;--ink:#0b1030;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(#0a1030,#03040c);color:var(--wool);font-family:'Rubik',system-ui,sans-serif;font-weight:500;overflow:hidden}
.screen{z-index:1;position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.screen.on{display:flex}
h1{font-family:'Tektur','Exo 2',sans-serif;font-weight:900;margin:0;line-height:1.1;letter-spacing:.06em;font-size:clamp(34px,10.5vw,86px);text-transform:uppercase;background:linear-gradient(100deg,#9b6bff,#4fa8ff,#ff4d6d,#9b6bff,#4fa8ff) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
.sub{font-size:clamp(22px,5.6vw,32px);margin:20px 0 32px;color:var(--wool);max-width:640px;line-height:1.3}
.btn{font-family:'Rubik',sans-serif;font-weight:800;font-size:clamp(28px,7vw,40px);background:var(--red);color:var(--wool);border:4px solid var(--wool);border-radius:14px;padding:14px 40px;cursor:pointer;box-shadow:none;position:relative;z-index:5}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.tile:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn.small{font-size:20px;padding:8px 18px;background:var(--teal)}
.shout{position:absolute;z-index:3;pointer-events:none;max-width:72vw;font-family:'Underdog','Neucha',cursive;font-weight:400;font-size:clamp(32px,8.5vw,58px);line-height:1.2;color:var(--wool);animation:appear 4.2s ease-in-out forwards;will-change:transform,opacity}
.shout.g{color:var(--gold)}
.shout.r{color:#c9b6ff}
@keyframes tw{0%{opacity:.3;text-shadow:0 0 2px currentColor}50%{opacity:1;text-shadow:0 0 6px #fff,0 0 18px currentColor,0 0 36px currentColor}100%{opacity:.45;text-shadow:0 0 3px currentColor}}
.shout .w{display:inline-block;white-space:nowrap}
.shout .l{display:inline-block;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes appear{0%{opacity:0;transform:scale(.92) rotate(var(--r))}25%{opacity:1;transform:scale(1) rotate(var(--r))}55%{opacity:1}100%{opacity:0;transform:scale(1.04) rotate(var(--r))}}
#pick{overflow:hidden;justify-content:flex-start;padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom))}
#pick h2{font-family:'Tektur','Exo 2',sans-serif;font-weight:900;font-size:clamp(26px,6.5vw,44px);margin:0 0 10px;color:#bfe6ff;text-transform:uppercase;letter-spacing:.05em;flex:none}
.who-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;width:min(94vw,520px)}
.who{font-family:'Tektur','Exo 2',sans-serif;font-weight:700;font-size:clamp(24px,6.5vw,36px);color:var(--wool);background:rgba(10,16,48,.7);border:3px solid var(--teal);border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;min-width:0;overflow:hidden}
.who:hover,.who:active{border-color:var(--gold)}
.who:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.who .thumb{flex:1;min-height:0;width:100%;border-radius:10px;background-size:cover;background-position:center}
.who.back{grid-column:1/-1;background:var(--teal);border-color:var(--wool)}
#game .bar{display:flex;gap:14px;align-items:center;margin-bottom:14px;font-size:28px;flex-wrap:wrap;justify-content:center}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:0;width:min(92vw,40vh,440px);aspect-ratio:1;background:rgba(10,16,48,.8);padding:0;border-radius:0}
.cell{background:rgba(10,16,48,.8);border-radius:0;min-width:0;min-height:0;position:relative}
.cell:empty{box-shadow:inset 0 0 0 1px rgba(154,215,255,.3)}
#board .piece{transform:scale(1.015)}
.cell.glow{z-index:2;animation:neon 1.6s ease-out forwards}
@keyframes neon{0%{box-shadow:0 0 4px 2px #d6f1ff,0 0 14px 5px #4fc3ff,0 0 32px 12px rgba(79,195,255,.7)}25%{box-shadow:0 0 4px 2px #bfe9ff,0 0 12px 4px #3fb8ff,0 0 28px 10px rgba(63,184,255,.55)}100%{box-shadow:0 0 0 0 rgba(79,195,255,0),0 0 0 0 rgba(79,195,255,0),0 0 0 0 rgba(79,195,255,0)}}
.cell.anchor{z-index:0}
.piece.locked{cursor:default}
.cell.over{background:rgba(154,215,255,.45)}
.piece{background-size:500% 500%;touch-action:none;cursor:grab;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.piece.lifted{opacity:.25}
#tray{--ts:calc((min(94vw,460px) - 12px - 24px)/7);width:min(94vw,460px);display:grid;grid-template-columns:repeat(7,var(--ts));gap:4px;padding:6px;min-height:calc(4*var(--ts) + 12px + 12px);align-content:start;background:rgba(10,16,48,.7);border-radius:12px;margin-top:12px}
#tray .piece{width:var(--ts);height:var(--ts);border-radius:4px}
.ghost{position:fixed;z-index:60;pointer-events:none;border-radius:4px;opacity:.95}
.hint{margin-top:10px;font-size:20px;max-width:90vw;line-height:1.3}
#win{position:absolute;inset:0;background:#000;opacity:0;display:none;z-index:20;overflow:hidden;transition:opacity 3.2s ease-in}
#win.on{display:block}
#win.show{opacity:1}
.credits{position:absolute;left:0;right:0;top:0;text-align:center;padding:0 16px;transform:translateY(100vh)}
.credits.roll{animation:roll 22s linear forwards}
@keyframes roll{from{transform:translateY(100vh)}to{transform:translateY(-100%)}}
.cr{margin:0 0 min(14vh,110px)}
.cr small{display:block;font-size:clamp(16px,4vw,22px);color:#8fa6c9;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;font-weight:500}
.cr b{display:block;font-size:clamp(30px,8vw,52px);font-weight:800;color:#eaf2ff}
.theend{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:20px}
.theend.on{display:flex}
.endtxt{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(76px,26vw,180px);color:#eaf2ff;line-height:1.1;white-space:pre}
.endtxt span{display:inline-block;clip-path:inset(-20% 100% -20% -10%);animation:write .5s ease-out forwards;animation-delay:calc(var(--k)*.45s)}
@keyframes write{from{clip-path:inset(-20% 100% -20% -10%)}to{clip-path:inset(-20% -10% -20% -10%)}}
.endbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;opacity:0;transition:opacity 1.5s;pointer-events:none}
.endbtns.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.cell.glow{animation-duration:2.4s}h1{animation:none}.shout{animation-duration:4s}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<section class="screen on" id="menu">
  <h1>Мозайка<br>Назаралиевы</h1>
  <p class="sub">Назаралиевтердин биринчи оюну</p>
  <button class="btn" id="start">Новая Игра</button>
</section>

<section class="screen" id="pick">
  <h2>Кто собирает?</h2>
  <div class="who-grid" id="whoGrid"></div>
</section>

<section class="screen" id="game">
  <div class="bar"><span>Ходов: <b id="moves">0</b></span><button class="btn small" id="back">Выбор</button><button class="btn small" id="again">Заново</button></div>
  <div id="board"></div>
  <div id="tray"></div>
  <div class="hint">Центральный кусочек уже на месте. Перетащи остальные на пустые ячейки</div>
  <div id="win">
    <div class="credits" id="credits">
      <div class="cr"><small>Семья в сборе</small><b id="winTxt"></b></div>
      <div class="cr"><small>Главный Разработчик</small><b>Эдил</b></div>
      <div class="cr"><small>Режиссер</small><b>Эдил</b></div>
      <div class="cr"><small>Актер второго плана</small><b>Эдил</b></div>
      <div class="cr"><small>Музыка</small><b>Эдил</b></div>
      <div class="cr"><small>Костюмы</small><b>Эдил</b></div>
    </div>
    <div class="theend" id="theend">
      <div class="endtxt" id="endtxt" aria-label="The End"></div>
      <div class="endbtns" id="endbtns"><button class="btn" id="next">Ещё раз</button><button class="btn small" id="other">Выбрать другого</button><button class="btn small" id="endMenu">В меню</button></div>
    </div>
  </div>
</section>

<script>

// Космос: туманности, галактики, мерцающие звёзды
(function(){
  const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
  let W,H,layer,stars=[],raf;
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function galaxy(g,x,y,R,tilt,sq,hue){
    g.save();g.translate(x,y);g.rotate(tilt);g.scale(1,sq);
    const core=g.createRadialGradient(0,0,0,0,0,R*.5);
    core.addColorStop(0,'rgba(225,238,255,.95)');core.addColorStop(.3,'rgba(140,190,255,.4)');core.addColorStop(1,'rgba(140,190,255,0)');
    g.fillStyle=core;g.beginPath();g.arc(0,0,R*.5,0,7);g.fill();
    for(let i=0;i<2600;i++){
      const t=Math.random(),rad=t*R,arm=(i%2)*Math.PI,ang=t*9+arm+(Math.random()-.5)*(.5+t*.5);
      const px=Math.cos(ang)*rad,py=Math.sin(ang)*rad;
      const c=t<.35?'190,215,255':t<.7?'170,120,255':hue;
      g.fillStyle='rgba('+c+','+(.15+Math.random()*.6)+')';
      g.fillRect(px,py,Math.random()*1.8+.4,Math.random()*1.8+.4);
    }
    g.restore();
  }
  function build(){
    W=cv.width=innerWidth;H=cv.height=innerHeight;
    layer=document.createElement('canvas');layer.width=W;layer.height=H;
    const g=layer.getContext('2d');
    g.fillStyle='#03040c';g.fillRect(0,0,W,H);
    [[.2,.25,.55,'80,40,160'],[.85,.7,.6,'30,80,190'],[.55,.9,.5,'60,50,150'],[.75,.15,.4,'40,120,180']].forEach(([x,y,r,c])=>{
      const m=Math.max(W,H)*r,gr=g.createRadialGradient(x*W,y*H,0,x*W,y*H,m);
      gr.addColorStop(0,'rgba('+c+',.32)');gr.addColorStop(1,'rgba('+c+',0)');g.fillStyle=gr;g.fillRect(0,0,W,H)});
    const m=Math.min(W,H);
    galaxy(g,W*.78,H*.2,m*.42,-.5,.38,'90,130,255');
    galaxy(g,W*.18,H*.82,m*.3,.6,.45,'110,150,255');
    for(let i=0;i<420;i++){g.fillStyle='rgba(235,243,255,'+(.2+Math.random()*.6)+')';g.fillRect(Math.random()*W,Math.random()*H,Math.random()*1.4+.3,Math.random()*1.4+.3)}
    stars=[...Array(90)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.6,p:Math.random()*6.3,s:.6+Math.random()*1.6}));
    cancelAnimationFrame(raf);draw(0);
  }

  function draw(t){
    ctx.drawImage(layer,0,0);
    for(const s of stars){
      const a=.35+.65*Math.abs(Math.sin(t/1000*s.s+s.p));
      ctx.fillStyle='rgba(225,238,255,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
      if(s.r>1.9){ctx.fillRect(s.x-s.r*3,s.y-.4,s.r*6,.8);ctx.fillRect(s.x-.4,s.y-s.r*3,.8,s.r*6)}
    }
    if(!still)raf=requestAnimationFrame(draw);
  }
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,200)});
  build();
})();
const N=5;
const menu=document.getElementById('menu'),game=document.getElementById('game'),board=document.getElementById('board');
const phrases=["Гойка Бия","Эй, сен нее!!","Липостной","Дөнгөлөк рожки жеп атабыз күнүгө"];
let shoutTimer,pi=0;

function shout(){
  if(!menu.classList.contains('on'))return;
  const el=document.createElement('div');
  el.className='shout '+['','g','r'][pi%3];
  phrases[pi%phrases.length].split(' ').forEach((word,wi)=>{
    if(wi)el.appendChild(document.createTextNode(' '));
    const w=document.createElement('span');w.className='w';
    [...word].forEach(ch=>{
      const l=document.createElement('span');l.className='l';l.textContent=ch;
      l.style.transform='rotate('+(Math.random()*24-12).toFixed(1)+'deg) translateY('+(Math.random()*.24-.12).toFixed(2)+'em) scale('+(0.9+Math.random()*.25).toFixed(2)+')';
      l.style.setProperty('--d',(0.9+Math.random()*1.1).toFixed(2)+'s');
      l.style.setProperty('--dl','-'+(Math.random()*2).toFixed(2)+'s');
      w.appendChild(l);
    });
    el.appendChild(w);
  });
  el.style.visibility='hidden';el.style.animation='none';
  el.style.setProperty('--r',(Math.random()*16-8)+'deg');
  menu.appendChild(el);
  const w=el.offsetWidth,h=el.offsetHeight,W=innerWidth,H=innerHeight,pad=18;
  const blocks=[...menu.querySelectorAll('h1,.sub,#start,.shout')].filter(n=>n!==el).map(n=>n.getBoundingClientRect());
  let spot=null;
  for(let i=0;i<60&&!spot;i++){
    const x=10+Math.random()*Math.max(0,W-w-20),y=10+Math.random()*Math.max(0,H-h-20);
    if(!blocks.some(b=>x<b.right+pad&&x+w>b.left-pad&&y<b.bottom+pad&&y+h>b.top-pad))spot=[x,y];
  }
  if(!spot){el.remove();return}
  pi++;
  el.style.left=spot[0]+'px';el.style.top=spot[1]+'px';
  el.style.visibility='';el.style.animation='';
  setTimeout(()=>el.remove(),4300);
}
function startShouts(){clearInterval(shoutTimer);shout();shoutTimer=setInterval(shout,1300)}
startShouts();

// Картина: войлочный узор в тёплых цветах
function makePicture(pal,seed){
  const S=500,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const [wool,gold,red,teal,brown]=pal;
  g.fillStyle=wool;g.fillRect(0,0,S,S);
  const diamond=(r,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(S/2,S/2-r);g.lineTo(S/2+r,S/2);g.lineTo(S/2,S/2+r);g.lineTo(S/2-r,S/2);g.closePath();g.fill()};
  g.fillStyle=teal;[[0,0],[S,0],[0,S],[S,S]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,150,0,7);g.fill()});
  diamond(250,brown);diamond(215,gold);diamond(170,red);diamond(120,wool);diamond(85,teal);diamond(40,gold);
  // рога барана по сторонам
  g.strokeStyle=red;g.lineWidth=10;
  [[S/2,50,0],[S/2,S-50,Math.PI],[50,S/2,-Math.PI/2],[S-50,S/2,Math.PI/2]].forEach(([x,y,a])=>{
    g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.arc(-18,0,16,Math.PI,Math.PI*2.9);g.stroke();g.beginPath();g.arc(18,0,16,-Math.PI*1.9,Math.PI*0);g.stroke();g.restore()});
  // уникальные точки в каждой клетке, чтобы кусочки различались
  let s=seed;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  const cs=S/N;
  for(let i=0;i<N*N;i++){
    const cx=(i%N)*cs,cy=Math.floor(i/N)*cs;
    for(let k=0;k<3;k++){g.fillStyle=[gold,red,teal,brown][Math.floor(rnd()*4)];
      g.beginPath();g.arc(cx+14+rnd()*(cs-28),cy+14+rnd()*(cs-28),5+rnd()*5,0,7);g.fill()}
  }
  return c.toDataURL();
}

let pic='';
function photoToSquare(src){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=500;
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,500,500);res(c.toDataURL('image/jpeg',.9))};
    im.onerror=()=>res(null);im.src=src;
  });
}
async function buildPics(){
  for(let i=0;i<PEOPLE.length;i++){
    const p=PEOPLE[i];let url=null;
    if(p.photo)url=await photoToSquare(p.photo);
    p.img=url||makePicture(p.pal,7+i*13);
  }
  const grid=document.getElementById('whoGrid');grid.innerHTML='';
  PEOPLE.forEach((p,i)=>{
    const b=document.createElement('button');b.className='who';
    b.textContent=p.name;
    b.onclick=()=>{cur=i;pic=p.img;newGame()};
    grid.appendChild(b);
  });
  const bk=document.createElement('button');bk.className='who back';bk.textContent='В меню';bk.onclick=toMenu;grid.appendChild(bk);
}
let cur=0;
buildPics();

  d.style.backgroundImage='url('+pic+')';
  d.style.backgroundPosition=((id%N)*100/(N-1))+'% '+(Math.floor(id/N)*100/(N-1))+'%';
  if(locked)d.classList.add('locked');else d.addEventListener('pointerdown',e=>startDrag(e,d));
  return d;
}
function render(){
  board.innerHTML='';
  cells.forEach((id,i)=>{
    const c=document.createElement('div');c.className='cell';c.dataset.i=i;
    if(id!==null){c.appendChild(pieceEl(id,i===CENTER));if(i===CENTER)c.classList.add('anchor')}
    board.appendChild(c);
  });
  trayEl.innerHTML='';
  tray.forEach(id=>trayEl.appendChild(pieceEl(id)));
  document.getElementById('moves').textContent=moves;
}
function cellAt(x,y){
  const r=board.getBoundingClientRect();
  if(x<r.left||x>r.right||y<r.top||y>r.bottom)return null;
  const cw=r.width/N,ch=r.height/N;
  const c=Math.min(N-1,Math.max(0,Math.floor((x-r.left)/cw))),rw=Math.min(N-1,Math.max(0,Math.floor((y-r.top)/ch)));
  return rw*N+c;
}
function startDrag(e,el){
  if(e.button>0)return;
  e.preventDefault();
  const id=+el.dataset.id,par=el.parentElement;
  const src=par.classList.contains('cell')?{t:'c',i:+par.dataset.i}:{t:'t'};
  const cs=board.firstChild.getBoundingClientRect().width;
  const ghost=el.cloneNode();ghost.className='piece ghost';
  ghost.style.width=ghost.style.height=cs+'px';
  document.body.appendChild(ghost);
  el.classList.add('lifted');
  let over=null;
  const pos=(x,y)=>{ghost.style.left=(x-cs/2)+'px';ghost.style.top=(y-cs/2)+'px'};
  pos(e.clientX,e.clientY);
  const move=ev=>{
    if(ev.pointerId!==e.pointerId)return;
    pos(ev.clientX,ev.clientY);
    let i=cellAt(ev.clientX,ev.clientY);
    if(i===CENTER)i=null;
    if(i!==over){if(over!==null)board.children[over].classList.remove('over');over=i;if(i!==null)board.children[i].classList.add('over')}
  };
  const up=ev=>{
    if(ev.pointerId!==e.pointerId)return;
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    ghost.remove();
    const idx=ev.type==='pointercancel'?null:cellAt(ev.clientX,ev.clientY);
    drop(id,src,idx);
  };
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function drop(id,src,idx){
  let placed=null;
  if(idx!==null){
    if(idx===CENTER||(src.t==='c'&&src.i===idx)){render();return}
    const occ=cells[idx];
    if(src.t==='c'){cells[src.i]=occ}
    else{const k=tray.indexOf(id);if(occ!==null)tray.splice(k,1,occ);else tray.splice(k,1)}
    cells[idx]=id;moves++;placed=idx;
  }else if(src.t==='c'){
    cells[src.i]=null;tray.push(id);
  }
  render();
  if(placed!==null){const c=board.children[placed];c.classList.add('glow');c.addEventListener('animationend',()=>c.classList.remove('glow'),{once:true})}
  if(cells.every((v,i)=>v===i)){
    document.getElementById('winTxt').textContent=moves+' ходов';
    startWin();
  }
}
const winEl=document.getElementById('win'),credits=document.getElementById('credits'),theend=document.getElementById('theend'),endtxt=document.getElementById('endtxt'),endbtns=document.getElementById('endbtns');
let winTimers=[];
function resetWin(){
  winTimers.forEach(clearTimeout);winTimers=[];
  winEl.classList.remove('on','show');credits.classList.remove('roll');credits.style.display='';credits.onanimationend=null;
  theend.classList.remove('on');endbtns.classList.remove('on');
}
function showEnd(){
  winTimers.forEach(clearTimeout);winTimers=[];
  credits.style.display='none';
  endtxt.innerHTML='';
  'The End'.split('').forEach((ch,k)=>{const sp=document.createElement('span');sp.textContent=ch;sp.style.setProperty('--k',k);endtxt.appendChild(sp)});
  theend.classList.add('on');
  winTimers.push(setTimeout(()=>endbtns.classList.add('on'),3700));
}
function startWin(){
  resetWin();winEl.classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>winEl.classList.add('show')));
  credits.onanimationend=showEnd;
  winTimers.push(setTimeout(()=>credits.classList.add('roll'),3400));
}
document.getElementById('endMenu').onclick=toMenu;
function newGame(){
  moves=0;
  resetWin();
  tray=[...Array(N*N).keys()].filter(k=>k!==CENTER);
  for(let i=tray.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tray[i],tray[j]]=[tray[j],tray[i]]}
  cells=Array(N*N).fill(null);cells[CENTER]=CENTER;
  render();show(game);
}
function toMenu(){
  show(menu);
  resetWin();startShouts();
}
function show(el){[menu,document.getElementById('pick'),game].forEach(x=>x.classList.remove('on'));el.classList.add('on')}
document.getElementById('start').onclick=()=>{show(document.getElementById('pick'))};
document.getElementById('other').onclick=()=>{resetWin();show(document.getElementById('pick'))};
document.getElementById('again').onclick=newGame;
document.getElementById('next').onclick=newGame;
document.getElementById('back').onclick=()=>show(document.getElementById('pick'));
</script>
